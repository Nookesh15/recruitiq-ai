name: Deploy — Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-frontend-production:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build -- --configuration production --base-href /recruitiq-ai/
        env:
          API_URL: ${{ secrets.PROD_API_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/browser

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  deploy-backend-production:
    name: Deploy Backend to Render (Production)
    runs-on: ubuntu-latest
    needs: deploy-frontend-production
    steps:
      - name: Trigger Render Deploy (Production)
        run: |
          curl -X POST "${{ secrets.RENDER_PROD_DEPLOY_HOOK }}"

      - name: Wait for backend to become healthy
        if: ${{ secrets.PROD_API_URL != '' }}
        run: |
          echo "Waiting for backend health check..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_API_URL }}/api/v1/health" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Backend health check failed after 2 minutes."
          exit 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
