<div class="min-h-screen bg-gradient-to-br from-indigo-900 via-indigo-800 to-purple-900 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
        <span class="text-white text-2xl font-bold">R</span>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">Welcome to RecruitIQ</h1>
      <p class="text-gray-500 text-sm mt-1">Sign in to your account</p>
    </div>

    <!-- Error -->
    @if (error) {
      <div class="bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-5 text-red-700 text-sm">
        {{ error }}
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="submit()" #form="ngForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="admin@recruitiq.ai"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition-all" />
      </div>

      <button
        type="submit"
        [disabled]="loading || !form.valid"
        [ngClass]="loading || !form.valid ? 'opacity-60 cursor-not-allowed' : 'hover:bg-indigo-700'"
        class="w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold transition-colors mt-2">
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="text-center text-xs text-gray-400 mt-6">
      Default: admin&#64;recruitiq.ai / Admin&#64;123
    </p>
  </div>
</div>
