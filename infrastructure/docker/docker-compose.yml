version: "3.9"

# ─────────────────────────────────────────────────────────────
# RecruitIQ — Local Dev Stack
# Usage:  docker compose up --build
# Requires: copy .env.example → .env and fill in MSSQL_SA_PASSWORD
# ─────────────────────────────────────────────────────────────

services:

  # ── SQL Server 2022 (Developer Edition — free) ────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recruitiq-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Str0ng!Pass2024}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD:-Str0ng!Pass2024}' -Q 'SELECT 1' -C -b -o /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── .NET 9 Backend ─────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: recruitiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;Database=RecruitIQ_Dev;User Id=sa;
        Password=${MSSQL_SA_PASSWORD:-Str0ng!Pass2024};
        TrustServerCertificate=True;
      AiEngineUrl: http://ai-engine:8000
    depends_on:
      db:
        condition: service_healthy

  # ── Python FastAPI AI Engine ────────────────────────────────
  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: Dockerfile
    container_name: recruitiq-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # ── Angular Frontend (nginx) ────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: recruitiq-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mssql_data:
