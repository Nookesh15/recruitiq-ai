version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: recruitiq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: recruitiq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=recruitiq;Username=postgres;Password=postgres
      - AiEngineUrl=http://ai-engine:8000
    depends_on:
      db:
        condition: service_healthy

  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: Dockerfile
    container_name: recruitiq-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db/recruitiq
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: recruitiq-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pg_data:
